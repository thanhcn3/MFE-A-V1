server {
    listen 80;
    server_name _;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript;


    location /api/auth-service/ {

            proxy_pass https://agentbanking.bbtech.io.vn/api/auth-service/;

            proxy_http_version 1.1;

            # SSL settings khi proxy HTTPS
            proxy_ssl_server_name on;
            proxy_ssl_verify off;

            proxy_set_header Host agentbanking.bbtech.io.vn;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;

            client_max_body_size 10m;
        }

     
    # =========================
    # REMOTE HOME
    # =========================
    location /remote-home/ {
        proxy_pass http://mfe-a-v1-remote-home-1:8082/;
        proxy_http_version 1.1;
    }

    # =========================
    # REMOTE ABOUT
    # =========================
    location /remote-about/ {
        proxy_pass http://mfe-a-v1-remote-about-1:8083/;
        proxy_http_version 1.1;
    }

    # =========================
    # REMOTE PROFILE
    # =========================
    location /remote-profile/ {
        proxy_pass http://mfe-a-v1-remote-profile-1:8084/;
        proxy_http_version 1.1;
    }

    # =========================
    # SHELL (LUÔN ĐỂ CUỐI)
    # =========================
    location / {
        proxy_pass http://mfe-a-v1-shell-1:8081;
        proxy_http_version 1.1;
    }
}
