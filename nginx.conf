events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    server_name _;

    # =====================
    # FRONTEND (SHELL SPA)
    # =====================
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    location /remote-home/ {
      try_files $uri $uri/ /remote-home/index.html;
    }

    location /remote-about/ {
      try_files $uri $uri/ /remote-about/index.html;
    }

    location /remote-profile/ {
      try_files $uri $uri/ /remote-profile/index.html;
    }

    # =====================
    # API PROXY → BACKEND THẬT
    # =====================
    location /api/ {

      # DNS (bắt buộc trong Docker)
      resolver 8.8.8.8 1.1.1.1 valid=300s;
      resolver_timeout 5s;

      # HTTPS backend
      proxy_pass https://agentbanking.bbtech.io.vn;
      proxy_http_version 1.1;
      proxy_ssl_server_name on;

      # headers chuẩn
      proxy_set_header Host agentbanking.bbtech.io.vn;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      proxy_redirect off;
    }

    # =====================
    # STATIC CACHE
    # =====================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
