events {}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    server_name _;

    # =====================
    # ROOT
    # =====================
    root /usr/share/nginx/html;
    index index.html;

    # =====================
    # SHELL (SPA)
    # =====================
    location / {
      try_files $uri $uri/ /index.html;
    }

    # =====================
    # REMOTE HOME
    # =====================
    location /remote-home/ {
      try_files $uri $uri/ /remote-home/index.html;
    }

    # =====================
    # REMOTE ABOUT
    # =====================
    location /remote-about/ {
      try_files $uri $uri/ /remote-about/index.html;
    }

    # =====================
    # REMOTE PROFILE
    # =====================
    location /remote-profile/ {
      try_files $uri $uri/ /remote-profile/index.html;
    }

    # =====================
    # API PROXY (FIX 405)
    # =====================
    location /api/ {

      # ---- CORS ----
      add_header Access-Control-Allow-Origin "*" always;
      add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
      add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;

      # Preflight request
      if ($request_method = OPTIONS) {
        return 204;
      }

      # ---- Proxy to backend ----
      proxy_pass https://agentbanking.bbtech.io.vn/;
      proxy_http_version 1.1;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =====================
    # STATIC FILE CACHE
    # =====================
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
      expires 1y;
      add_header Cache-Control "public, immutable";
    }
  }
}
