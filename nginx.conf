events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name localhost;

        # Shell app (main host)
        location / {
            root /usr/share/nginx/html/shell;
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Remote Home
        location /remote-home/ {
            alias /usr/share/nginx/html/remote-home/;
            try_files $uri $uri/ /remote-home/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Remote About
        location /remote-about/ {
            alias /usr/share/nginx/html/remote-about/;
            try_files $uri $uri/ /remote-about/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Remote Profile
        location /remote-profile/ {
            alias /usr/share/nginx/html/remote-profile/;
            try_files $uri $uri/ /remote-profile/index.html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
