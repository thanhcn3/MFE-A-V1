events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Shell application (main host)
        location / {
            alias /usr/share/nginx/html/shell/;
            try_files $uri $uri/ /shell/index.html;
            
            # Cache busting for assets
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Remote Home micro-frontend
        location /remote-home/ {
            alias /usr/share/nginx/html/remote-home/;
            try_files $uri $uri/ /remote-home/index.html;
            
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Remote About micro-frontend
        location /remote-about/ {
            alias /usr/share/nginx/html/remote-about/;
            try_files $uri $uri/ /remote-about/index.html;
            
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Remote Profile micro-frontend
        location /remote-profile/ {
            alias /usr/share/nginx/html/remote-profile/;
            try_files $uri $uri/ /remote-profile/index.html;
            
            location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
            }
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
