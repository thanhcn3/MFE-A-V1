<div class="about-container">
  <section class="about-story">
    <div class="story-image">
      <img [src]="storyImage" alt="About our company">
    </div>
    <div class="story-content">
      <h2>{{ 'ABOUT.TITLE' | translate }}</h2>
      <p class="lead">{{ 'ABOUT.DESC_1' | translate }}</p>
      <p>{{ 'ABOUT.DESC_2' | translate }}</p>
    </div>
  </section>

  <section class="team-section">
    <h2>{{ 'ABOUT.MEET_TEAM' | translate }}</h2>
    <div class="team-grid">
      <div class="team-card" *ngFor="let member of teamMembers">
        <div class="member-image-wrapper">
          <img [src]="member.image" [alt]="member.name" class="member-image">
        </div>
        <div class="member-info">
          <h3>{{ member.name }}</h3>
          <span class="role">{{ member.role }}</span>
          <p>{{ member.bio }}</p>
        </div>
      </div>
    </div>
  </section>
</div>
