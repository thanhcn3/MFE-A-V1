<aside class="sidebar-container">
  <a routerLink="/" class="brand">
    <span class="brand-logo"></span>
    <span class="brand-text">MFE Demo</span>
  </a>

  <ul class="nav-links">
    <li *ngFor="let item of menuItems">
      <a *ngIf="item.children" [routerLink]="item.path" routerLinkActive="active" class="nav-link parent" [class.expanded]="item.open" (click)="onParentClick(item, $event)">
        <span class="bullet"></span>
        <span class="label">{{ item.labelKey ? (item.labelKey | translate) : item.label }}</span>
        <span class="chevron" [class.rotate]="item.open" (click)="onParentClick(item, $event); $event.stopPropagation(); $event.preventDefault()">›</span>
      </a>

      <a *ngIf="!item.children" [routerLink]="item.path" routerLinkActive="active" class="nav-link" (click)="onLeafClick(item)">
        <span class="bullet"></span>
        <span class="label">{{ item.labelKey ? (item.labelKey | translate) : item.label }}</span>
      </a>

      <ul *ngIf="item.children" class="child-list" [class.open]="item.open">
        <li *ngFor="let child of item.children">
          <a [routerLink]="child.path" routerLinkActive="active" class="nav-link child" (click)="onChildClick(item, child)">
            <span class="bullet"></span>
            <span class="label">{{ child.labelKey ? (child.labelKey | translate) : child.label }}</span>
          </a>
        </li>
      </ul>
    </li>
  </ul>

  <div class="user-profile dropdown">
    <a href="#" class="dropdown-toggle" id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
      <img src="assets/images/avatar-john.jpg" alt="User" class="avatar">
      <div class="user-info">
        <strong>John Doe</strong>
        <small>Admin</small>
      </div>
    </a>
    <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
      <li><a class="dropdown-item" href="#">New project...</a></li>
      <li><a class="dropdown-item" href="#">Settings</a></li>
      <li><a class="dropdown-item" href="#" routerLink="/profile">Profile</a></li>
      <li><hr class="dropdown-divider"></li>
      <li><a class="dropdown-item" href="#" (click)="logout()">Sign out</a></li>
    </ul>
  </div>
</aside>
