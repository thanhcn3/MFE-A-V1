<header class="topbar-container">
  <div class="page-title">
    <h1>{{ 'SHELL.TITLE' | translate }}</h1>
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <ol>
        <li *ngFor="let crumb of (breadcrumb$ | async) ?? []; let last = last" [class.current]="last">
          <a *ngIf="crumb.path && !last" [routerLink]="crumb.path">{{ crumb.labelKey ? (crumb.labelKey | translate) : crumb.label }}</a>
          <span *ngIf="!crumb.path || last">{{ crumb.labelKey ? (crumb.labelKey | translate) : crumb.label }}</span>
          <span *ngIf="!last" class="crumb-separator">›</span>
        </li>
      </ol>
    </nav>
  </div>
  
  <div class="topbar-actions">
    <div class="lang-switcher">
      <button 
        [class.active]="currentLang === 'vi'" 
        (click)="changeLanguage('vi')" 
        title="Tiếng Việt">
        🇻🇳 VN
      </button>
      <button 
        [class.active]="currentLang === 'en'" 
        (click)="changeLanguage('en')" 
        title="English">
        🇺🇸 EN
      </button>
    </div>
    <button class="icon-btn">
      🔔 <span class="badge">3</span>
    </button>
    <button class="icon-btn">
      ⚙️
    </button>
    <div class="user-pill">
      Admin
    </div>
  </div>
</header>
