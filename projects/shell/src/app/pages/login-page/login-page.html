<div class="login-container">
  <div class="login-card">
    <h2>Login</h2>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" [(ngModel)]="username" class="form-control" placeholder="Enter username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" class="form-control" placeholder="Enter password">
    </div>
    <button (click)="login()" [disabled]="isLoading()" class="btn btn-primary">
      {{ isLoading() ? 'Loading...' : 'Login' }}
    </button>
  </div>
</div>
