<div class="toast-container">
  @for (toast of toastService.toasts(); track toast.id) {
    <div class="toast-card" [ngClass]="toast.type">
      <!-- <div class="toast-icon">
        <ng-container [ngSwitch]="toast.type">
          <i *ngSwitchCase="'success'" class="fa-solid fa-circle-check"></i>
          <i *ngSwitchCase="'error'" class="fa-solid fa-exclamation-circle"></i>
          <i *ngSwitchCase="'info'" class="fa-solid fa-info-circle"></i>
          <i *ngSwitchCase="'warning'" class="fa-solid fa-exclamation-triangle"></i>
        </ng-container>
      </div> -->
      <div class="toast-content">
        <div class="toast-title">{{ toast.title ? toast.title : toast.type }}</div>
        <div class="toast-message">{{ toast.message }}</div>
      </div>
      <button
        class="toast-close"
        (click)="toastService.remove(toast.id)"
        aria-label="Close"
      >
        <i class="fa fa-times" aria-hidden="true"></i>
        <span class="sr-only">Close</span>
      </button>
    </div>
  }
</div>
