<div class="toast-container" aria-live="polite" aria-atomic="true">
  <div class="toast-card" *ngFor="let toast of toastService.toasts(); trackBy: trackById" [ngClass]="toast.type">
    <div class="toast-left">
      <div class="toast-icon">
        <img class="toast-icon-img" [src]="getIcon(toast.type)" [alt]="toast.type + ' toast icon'" />
      </div>
    </div>

    <div class="toast-body">
      <div class="toast-title">
        {{ toast.title || toast.type }}
      </div>
      <div class="toast-message">
        {{ toast.message }}
      </div>
    </div>

    <button
      class="toast-close"
      (click)="toastService.remove(toast.id)"
      aria-label="Close">
      <img class="toast-close-icon" [src]="closeIcon" alt="Close" />
    </button>
  </div>
</div>
