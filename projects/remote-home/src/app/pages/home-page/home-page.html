<div class="home-container">
  <header class="hero" [style.background-image]="heroImage">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Welcome to MFE Home</h1>
      <p>Building the future with Micro Frontends</p>
      <div class="cta-group">
        <button routerLink="/about" class="cta-button">Learn More</button>
        <button (click)="callApi()" class="cta-button secondary">Test API</button>
      </div>
      <div *ngIf="data" class="api-result">
        API Result: {{ data | json }}
      </div>
    </div>
  </header>

  <section class="features">
    <h2>Our Core Features</h2>
    <div class="feature-grid">
      <div class="feature-card" *ngFor="let feature of features">
        <img [src]="feature.image" [alt]="feature.title" class="feature-image">
        <div class="feature-info">
          <h3>{{ feature.title }}</h3>
          <p>{{ feature.description }}</p>
        </div>
      </div>
    </div>
  </section>
</div>
