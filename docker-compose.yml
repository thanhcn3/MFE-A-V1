version: "3.9"

services:
  nginx:
    build: docker/nginx
    ports:
      - "8080:80"
    depends_on:
      - shell
      - remote-home
      - remote-about
      - remote-profile

  shell:
    build:
      context: .
      dockerfile: docker/shell/Dockerfile

  remote-home:
    build:
      context: .
      dockerfile: docker/remote-home/Dockerfile

  remote-about:
    build:
      context: .
      dockerfile: docker/remote-about/Dockerfile

  remote-profile:
    build:
      context: .
      dockerfile: docker/remote-profile/Dockerfile
