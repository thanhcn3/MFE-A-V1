services:
  shell:
    build:
      context: .
      dockerfile: Dockerfile.shell
    expose:
      - "8081"

  remote-home:
    build:
      context: .
      dockerfile: Dockerfile.remote-home
    expose:
      - "8082"

  remote-about:
    build:
      context: .
      dockerfile: Dockerfile.remote-about
    expose:
      - "8083"

  remote-profile:
    build:
      context: .
      dockerfile: Dockerfile.remote-profile
    expose:
      - "8084"

  nginx:
    build: docker/nginx
    ports:
      - "8080:80"
    depends_on:
      - shell
      - remote-home
      - remote-about
      - remote-profile
